description = "Medallion (bronze/silver/gold) data warehouse built with PySpark and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.2",
    "pydantic-settings>=2.11.0",
    "pyspark>=3.5.0",
    "pytest>=8.4.2",
    "sqlmodel>=0.0.27",
    "psycopg2-binary>=2.9.0",
]
